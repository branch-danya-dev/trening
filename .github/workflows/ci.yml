# Сборка и тесты всего решения — на каждый PR и на пуш в main
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Сборка
        run: dotnet build WorkoutCalculator.sln -c Release
      - name: Тесты
        run: dotnet test WorkoutCalculator.sln -c Release --no-build
      - name: Reproduce Hall composition benchmark
        run: |
          dotnet run -c Release --no-build --project tools/WorkoutCalculator.CompositionBenchmark -- --legacy-only --check
          dotnet run -c Release --no-build --project tools/WorkoutCalculator.CompositionBenchmark -- --check
      - name: JS-тесты (проверка позы, архив)
        run: node --test tests/js/*.test.mjs
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Research infrastructure invariants (synthetic tests only)
        run: |
          python -m pip install -r tools/requirements-shape-research.txt
          python tools/research_repository_guard.py
          python tools/pre_ui_security_audit.py "$RUNNER_TEMP/pre-ui-security.json"
          python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Frozen MakeHuman geometry fixtures
        run: dotnet run -c Release --project tools/WorkoutCalculator.GeometryWarpBenchmark -- . "$RUNNER_TEMP/geometry-fixtures.json"
      - name: Synthetic pre-UI scenarios and native history audit
        run: dotnet run -c Release --no-build --project tools/WorkoutCalculator.PreUiAudit -- . "$RUNNER_TEMP/pre-ui-fixtures"
      - name: Anatomical muscle benchmark (bundled asset, no anatomy download)
        run: dotnet run -c Release --no-build --project tools/WorkoutCalculator.AnatomicalMorphBenchmark -- . "$RUNNER_TEMP/anatomical-evidence"
      - name: Model provenance and desktop performance
        run: dotnet run -c Release --no-build --project tools/WorkoutCalculator.ShapeResearch -- --performance . "$RUNNER_TEMP/model-hardening-evidence/performance.json"
      - name: Установка браузера для 3D smoke
        run: |
          npm install --prefix "$RUNNER_TEMP/muscle-smoke" playwright@1.62.1
          "$RUNNER_TEMP/muscle-smoke/node_modules/.bin/playwright" install --with-deps chromium
      - name: Browser smoke (анимация + мышечная нагрузка, режимы, ленты, видео)
        env:
          APP_URL: http://127.0.0.1:5256
        run: |
          dotnet run --project src/WorkoutCalculator.Web -c Release --no-build --urls "$APP_URL" > "$RUNNER_TEMP/viewer.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl -fsS "$APP_URL" > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat "$RUNNER_TEMP/viewer.log"; exit 1; fi
          NODE_PATH="$RUNNER_TEMP/muscle-smoke/node_modules" MODEL_OUTPUT="$RUNNER_TEMP/model-hardening-evidence" node tests/browser/model-startup-benchmark.cjs
          NODE_PATH="$RUNNER_TEMP/muscle-smoke/node_modules" ANATOMY_OUTPUT="$RUNNER_TEMP/anatomical-evidence" node tests/browser/anatomical-muscle-smoke.cjs
          NODE_PATH="$RUNNER_TEMP/muscle-smoke/node_modules" ANATOMY_OUTPUT="$RUNNER_TEMP/anatomical-evidence" node tests/browser/anatomical-muscle-audit.cjs
          NODE_PATH="$RUNNER_TEMP/muscle-smoke/node_modules" GEOMETRY_FIXTURES="$RUNNER_TEMP/geometry-fixtures.json" GEOMETRY_OUTPUT="$RUNNER_TEMP/geometry-evidence" node tests/browser/geometry-warp-benchmark.cjs
          NODE_PATH="$RUNNER_TEMP/muscle-smoke/node_modules" GEOMETRY_FIXTURES="$RUNNER_TEMP/geometry-fixtures.json" GEOMETRY_OUTPUT="$RUNNER_TEMP/geometry-evidence" node tests/browser/geometry-warp-webgl.cjs
          NODE_PATH="$RUNNER_TEMP/muscle-smoke/node_modules" GEOMETRY_FIXTURES="$RUNNER_TEMP/geometry-fixtures.json" GEOMETRY_OUTPUT="$RUNNER_TEMP/geometry-evidence" node tests/browser/geometry-warp-smoke.cjs
          NODE_PATH="$RUNNER_TEMP/muscle-smoke/node_modules" GEOMETRY_ANATOMICAL=1 GEOMETRY_FIXTURES="$RUNNER_TEMP/geometry-fixtures.json" GEOMETRY_OUTPUT="$RUNNER_TEMP/geometry-evidence/anatomical" node tests/browser/geometry-warp-smoke.cjs
          NODE_PATH="$RUNNER_TEMP/muscle-smoke/node_modules" node tests/browser/skeletal-smoke.cjs
          NODE_PATH="$RUNNER_TEMP/muscle-smoke/node_modules" node tests/browser/strength-smoke.cjs
          NODE_PATH="$RUNNER_TEMP/muscle-smoke/node_modules" node tests/browser/history-smoke.cjs
          NODE_PATH="$RUNNER_TEMP/muscle-smoke/node_modules" node tests/browser/forecast-smoke.cjs
          NODE_PATH="$RUNNER_TEMP/muscle-smoke/node_modules" node tests/browser/composition-smoke.cjs
          NODE_PATH="$RUNNER_TEMP/muscle-smoke/node_modules" node tests/browser/muscle-forecast-smoke.cjs
          NODE_PATH="$RUNNER_TEMP/muscle-smoke/node_modules" node tests/browser/product-smoke.cjs
          NODE_PATH="$RUNNER_TEMP/muscle-smoke/node_modules" node tests/browser/avatar-smoke.cjs
          NODE_PATH="$RUNNER_TEMP/muscle-smoke/node_modules" AVATAR_OUTPUT="$RUNNER_TEMP/model-hardening-evidence/avatar" node tests/browser/avatar-creation-smoke.cjs
          NODE_PATH="$RUNNER_TEMP/muscle-smoke/node_modules" ACTIVITY_OUTPUT="$RUNNER_TEMP/activity-evidence" node tests/browser/activity-day-smoke.cjs
          NODE_PATH="$RUNNER_TEMP/muscle-smoke/node_modules" NUTRITION_OUTPUT="$RUNNER_TEMP/nutrition-evidence" node tests/browser/nutrition-smoke.cjs
          NODE_PATH="$RUNNER_TEMP/muscle-smoke/node_modules" HYPOTHESIS_OUTPUT="$RUNNER_TEMP/hypothesis-evidence" node tests/browser/hypothesis-smoke.cjs
          NODE_PATH="$RUNNER_TEMP/muscle-smoke/node_modules" CHECKIN_OUTPUT="$RUNNER_TEMP/checkin-evidence" node tests/browser/checkin-smoke.cjs
          NODE_PATH="$RUNNER_TEMP/muscle-smoke/node_modules" node tests/browser/errors-smoke.cjs
          NODE_PATH="$RUNNER_TEMP/muscle-smoke/node_modules" PRE_UI_OUTPUT="$RUNNER_TEMP/pre-ui-evidence" node tests/browser/pre-ui-storage.cjs
          NODE_PATH="$RUNNER_TEMP/muscle-smoke/node_modules" GEOMETRY_FIXTURES="$RUNNER_TEMP/geometry-fixtures.json" PRE_UI_FIXTURES="$RUNNER_TEMP/pre-ui-fixtures" PRE_UI_OUTPUT="$RUNNER_TEMP/pre-ui-evidence" node tests/browser/pre-ui-fixtures.cjs
          NODE_PATH="$RUNNER_TEMP/muscle-smoke/node_modules" GEOMETRY_FIXTURES="$RUNNER_TEMP/geometry-fixtures.json" PRE_UI_OUTPUT="$RUNNER_TEMP/pre-ui-evidence" node tests/browser/pre-ui-mixed.cjs
          NODE_PATH="$RUNNER_TEMP/muscle-smoke/node_modules" PRE_UI_FIXTURES="$RUNNER_TEMP/pre-ui-fixtures" PRE_UI_OUTPUT="$RUNNER_TEMP/pre-ui-evidence" node tests/browser/pre-ui-history.cjs
      - name: Model hardening evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-hardening-evidence
          path: ${{ runner.temp }}/model-hardening-evidence
          if-no-files-found: ignore
      - name: ActivityDay browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: activity-day-evidence
          path: ${{ runner.temp }}/activity-evidence
          if-no-files-found: ignore
      - name: Nutrition browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nutrition-evidence
          path: ${{ runner.temp }}/nutrition-evidence
          if-no-files-found: ignore
      - name: Hypothesis browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hypothesis-evidence
          path: ${{ runner.temp }}/hypothesis-evidence
          if-no-files-found: ignore
      - name: Check-in browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkin-evidence
          path: ${{ runner.temp }}/checkin-evidence
          if-no-files-found: ignore
      - name: Published PWA offline smoke from /trening/
        # Includes the new local hypothesis modules in the published offline cache.
        run: |
          dotnet publish src/WorkoutCalculator.Web -c Release --no-restore -o "$RUNNER_TEMP/offline"
          node tests/browser/static-server.cjs "$RUNNER_TEMP/offline/wwwroot" 5257 > "$RUNNER_TEMP/offline.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5257/trening/ > /dev/null; then break; fi
            sleep 1
          done
          NODE_PATH="$RUNNER_TEMP/muscle-smoke/node_modules" node tests/browser/offline-smoke.cjs
          NODE_PATH="$RUNNER_TEMP/muscle-smoke/node_modules" APP_URL="http://127.0.0.1:5257/trening/" GEOMETRY_PWA=1 GEOMETRY_FIXTURES="$RUNNER_TEMP/geometry-fixtures.json" GEOMETRY_OUTPUT="$RUNNER_TEMP/geometry-evidence/pwa" node tests/browser/geometry-warp-smoke.cjs
          NODE_PATH="$RUNNER_TEMP/muscle-smoke/node_modules" PWA_ROOT="$RUNNER_TEMP/offline/wwwroot" PRE_UI_FIXTURES="$RUNNER_TEMP/pre-ui-fixtures" PRE_UI_OUTPUT="$RUNNER_TEMP/pre-ui-evidence" node tests/browser/pwa-version-transition.cjs
      - name: Pre-UI stabilization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-ui-stabilization-evidence
          path: |
            ${{ runner.temp }}/pre-ui-evidence
            ${{ runner.temp }}/pre-ui-fixtures/native.json
          if-no-files-found: error
      - name: Geometry warp evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geometry-warp-evidence
          path: ${{ runner.temp }}/geometry-evidence
          if-no-files-found: ignore
      - name: Anatomical muscle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anatomical-muscle-evidence
          path: ${{ runner.temp }}/anatomical-evidence
          if-no-files-found: ignore
